id: robotprobe-incident-robofac
version: 0.1.0
plugins:
  - id: robotprobe.incident_datasets.robofac
    type: adapter
    version: 0.1.0
    entrypoint: robotprobe.integrations.incident_datasets.robofac:convert_robofac_episodes
    files:
      - docs/README.md
    safety:
      release_classification: trace_only
      hardware_allowed: false
    claims:
      proves:
        - converts selected RoboFAC metadata and optional H5 trajectories into RobotProbe incident traces
      does_not_prove:
        - hardware certification
        - clean-vs-perturbed causal replay
