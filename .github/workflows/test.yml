name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra simulators

      - name: Lint
        run: uv run ruff check robotprobe robotsec_range tests scripts

      - name: Test
        run: uv run pytest

      - name: Demo smoke
        run: |
          uv run robotprobe demo --out /tmp/robotprobe-demo
          test -f /tmp/robotprobe-demo/report.md
          test -f /tmp/robotprobe-demo/check.json

      - name: Pack smoke
        run: |
          uv run robotprobe pack validate examples/packs/libero-action-contracts
          uv run robotprobe pack test examples/packs/libero-action-contracts
          uv run robotprobe pack claims examples/packs/libero-action-contracts

  nnsight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install optional CPU capture runtime
        run: uv sync --frozen --extra nnsight

      - name: Require optional runtime
        run: uv run --frozen --no-sync python -c "import torch, nnsight"

      - name: Test NNsight capture and persistence
        run: uv run --frozen --no-sync pytest tests/test_mech*.py
